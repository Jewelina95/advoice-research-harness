function stateCards(c){const states=(c.states||[]).slice(0,3);if(states.length)return `<div class="states">${states.map((s,i)=>`<article class="state"><b>${tr().findings[['lex','info','pause'][i]][0]}</b><p>${tr().findings[['lex','info','pause'][i]][1]}</p><span class="state-status ${Number(s.value||0)<.45?'normal':''}">${tr().status[Number(s.value||0)<.45?'normal':Number(s.value||0)<.7?'mild':'high']}</span></article>`).join('')}</div>`;return `<div class="states">${['lex','info','pause'].map(x=>`<article class="state"><b>${tr().findings[x][0]}</b><p>${tr().findings[x][1]}</p><span class="state-status">${tr().status.mild}</span></article>`).join('')}</div>`}

function traceLabel(key){const map={lexical:tr().findings.lex[0],information:tr().findings.info[0],pause:tr().findings.pause[0],continuity:tr().findings.pause[0],output:tr().findings.info[0]};return map[key]||key}
function traceBlock(c){const opts=traceOptions(c),key=opts[0][0];return `<div class="trace-layout"><section class="trace-panel"><div class="trace-head"><div><h2>${tr().trace}</h2><p>${tr().traceIntro}</p></div></div><div class="trace-tools">${opts.map((o,i)=>`<button class="${i===0?'active':''}" data-trace="${esc(o[0])}" onclick="chooseTrace(this,'${c.id}','${esc(o[0])}')">${esc(traceLabel(o[0]))}</button>`).join('')}</div><div class="chart-wrap"><svg class="trajectory" id="trajectory-${c.id}" data-case="${c.id}" data-key="${key}"></svg></div><div class="legend"><span><i class="median"></i>${tr().median}</span><span><i class="iqr"></i>${tr().iqr}</span></div><div class="segment-detail" id="segment-${c.id}"><div><b>${tr().select}</b><p>${tr().selectHelp}</p></div><blockquote>—</blockquote></div><div class="trace-chain">${tr().chain.map((x,i)=>`${i?'<div class="trace-arrow">→</div>':''}<div class="trace-node"><b>${x[0]}</b><br><small>${x[1]}</small></div>`).join('')}</div><div class="chat"><h3>${tr().ask}</h3><div class="messages" id="messages-${c.id}"><div class="msg"><b>${agentText()}:</b> ${tr().offline}</div></div><div class="quick">${tr().questions.map((q,i)=>`<button onclick="ask('${c.id}',${i})">${q}</button>`).join('')}</div><div class="chat-row"><input id="chat-${c.id}" placeholder="${tr().placeholder}"><button class="secondary" onclick="ask('${c.id}')">${tr().send}</button></div></div></section><aside class="rating-panel">${rating(c,'ours')}</aside></div>`}

function casePage(c,index){return `<section class="page"><div class="case-head"><div><div class="eyebrow">${tr().case} ${String(index+1).padStart(2,'0')}</div><h1>${esc(caseTitle(c))}</h1><p class="lead">${esc(caseDescription(c))}</p></div><div class="audio-card"><b>${tr().audio}</b><audio id="audio-${c.id}" preload="metadata" src="${esc(c.audio)}"></audio><div class="audio-actions"><button onclick="playFull('${c.id}')">${tr().play}</button><button onclick="stopFull('${c.id}')">${tr().stop}</button></div><div class="meta"><div>${tr().duration}: ${esc(c.duration)}s</div><div>${tr().language}: ${esc(caseLanguage())}</div></div></div></div><section class="phase"><div class="phase-tag">${tr().stage1}</div><div class="field"><label>${tr().initial}</label><select onchange="ratings['${c.id}__initial']=this.value;persist()">${['hc','mci','ad','ci'].map(k=>`<option>${diagnosisText(k)}</option>`).join('')}</select></div><div class="field"><label>${tr().confidence}</label>${scale(c.id+'__initial_confidence')}</div><div class="field"><label>${tr().note}</label><textarea onchange="ratings['${c.id}__note']=this.value;persist()"></textarea></div></section><section class="phase"><div class="phase-tag">${tr().stage2}</div><div class="condition-tabs">${['b1','b2','ours'].map(k=>`<button class="${condition===k?'active':''}" onclick="setCondition('${k}')">${tr().conds[k]}</button>`).join('')}</div>${['b1','b2','ours'].map(k=>conditionView(c,k)).join('')}</section></section>`}

function drawTrajectory(svg){const c=cases.find(x=>x.id===svg.dataset.case),key=svg.dataset.key,segments=c.segments||[],ref=c.trajectory_reference?.[key]||{q1:.25,median:.42,q3:.58},W=920,H=310,m={l:68,r:24,t:35,b:52},iw=W-m.l-m.r,ih=H-m.t-m.b,maxT=Math.max(1,...segments.map(s=>Number(s.end)||0)),x=t=>m.l+t/maxT*iw,y=v=>m.t+(1-Math.max(0,Math.min(1,Number(v)||0)))*ih;let h=`<rect x="${m.l}" y="${y(ref.q3)}" width="${iw}" height="${Math.max(2,y(ref.q1)-y(ref.q3))}" fill="#dcebe2"/><line x1="${m.l}" y1="${y(ref.median)}" x2="${W-m.r}" y2="${y(ref.median)}" stroke="#477760" stroke-width="2" stroke-dasharray="7 6"/>`;for(let i=0;i<=4;i++){const v=i/4;h+=`<line x1="${m.l}" y1="${y(v)}" x2="${W-m.r}" y2="${y(v)}" stroke="#e1e7e4"/><text x="${m.l-10}" y="${y(v)+4}" text-anchor="end" fill="#62717a" font-size="12">${v.toFixed(2)}</text>`}const step=maxT>240?60:30;for(let n=0;n<=maxT;n+=step)h+=`<text x="${x(n)}" y="${H-22}" text-anchor="middle" fill="#62717a" font-size="12">${fmt(n)}</text>`;const pts=segments.map(s=>`${x((s.start+s.end)/2)},${y(s.scores?.[key]??0)}`).join(' ');h+=`<polyline points="${pts}" fill="none" stroke="#a94f4d" stroke-width="3"/>`;segments.forEach(s=>h+=`<circle tabindex="0" data-seg="${s.idx}" cx="${x((s.start+s.end)/2)}" cy="${y(s.scores?.[key]??0)}" r="5.5" fill="#a94f4d" stroke="#fff" stroke-width="2"/>`);h+=`<text x="${m.l+iw/2}" y="${H-3}" text-anchor="middle" fill="#3e4c54" font-size="13">${tr().xAxis}</text><text transform="translate(17 ${m.t+ih/2}) rotate(-90)" text-anchor="middle" fill="#3e4c54" font-size="13">${tr().yAxis}</text>`;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=h;svg.querySelectorAll('circle').forEach(p=>p.onclick=()=>showSegment(c,key,Number(p.dataset.seg)))}
