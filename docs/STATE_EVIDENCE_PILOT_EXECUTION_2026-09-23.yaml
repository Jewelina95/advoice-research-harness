training:
  module_a: fold_safe_existing_low_capacity_base
  oof_folds: 5
  oof_grouping: subject_and_source_duplicate_group
  refit_references_each_fold: true
  reuse_in_sample_base_predictions: false
  module_b:
    family: regularized_two_head_logit_stacking
    inputs: [base_log_odds, agent_contrast, state_replay_log_odds_delta]
    intercept: true
    coefficient_prior: [1.0, 0.0, 0.0, 0.0]
    l2_lambda: 1.0
    penalized_loss_reduction: mean
    feature_scale_fit_partition: development_only
    preserve_base_log_odds_scale: true
    non_intercept_coefficients_nonnegative: true
    missing_agent_policy: declared_base_fallback
    hyperparameter_search: false
    evaluate_fit_rows_as_generalization: false
  future_search_requires_inner_refitting: true
agent:
  first_pass_hidden: [base_probabilities, truth, diagnostic_paths, dataset_subject_labels]
  output_mode: typed_decisions_and_bounded_operations
  max_calls_per_subject: 2
  changed_state_requires_fresh_assessment: true
  second_pass_allows_further_patch: false
  batch_generate_clinical_reports: false
  exact_model_id: resolve_and_freeze_before_calls
evaluation:
  arms: [base, agent_judgment_joint, state_replay_joint, agent_state_joint]
  base_calibration: matched_oof_slope_and_intercept
  uncalibrated_base: supplementary_only
  fallback: frozen_calibrated_base
  matched_available_training_sensitivity: true
  retain_all_assigned_subjects: true
  count_failures_and_fallbacks: true
  paired_subject_bootstrap: true
  report_layer_a: true
  report_layer_b: true
  stress_results_separate: true
  speechcare_superiority_claim_from_pilot: false
budget:
  core_subject_target: 371
  core_initial_call_upper_bound: 371
  core_total_call_upper_bound: 742
  model_comparison_subjects: 24
  model_comparison_call_upper_bound: 144
  canary_accounting: separate_unless_exact_cache_reuse
  token_cost_budget: required_in_resolved_config_before_execution
  estimate_runtime_after_canary: true
stages: [inventory, freeze_split, fit_oof, agent_assess, fit_fusion, evaluate_holdout, stress, render]
delegation:
  - id: W0
    scope: shared_contracts_and_acceptance
    depends_on: []
  - id: W1
    scope: manifests_splits_cache_provenance
    depends_on: [W0]
