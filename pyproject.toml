[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advoice-harness"
version = "0.1.0"
description = "Configuration-driven AD voice screening research harness"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "joblib>=1.2",
  "librosa>=0.11",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "soundfile>=0.12",
]

[project.optional-dependencies]
agent = ["faster-whisper>=1.2"]
dev = ["pytest>=7.4"]

[project.scripts]
advoice = "advoice.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

