[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advoice-harness"
version = "0.2.0"
description = "Evidence-governed AD voice screening and diagnostic-agent research harness"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "jieba>=0.42.1",
  "joblib>=1.2",
  "librosa>=0.11",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openai>=2,<3",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "soundfile>=0.12",
  "torch>=2.4",
  "transformers>=4.45,<6",
  "webrtcvad>=2.0.10",
]

[project.optional-dependencies]
agent = [
  "faster-whisper>=1.2",
  "mlx-whisper==0.4.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
dev = ["pytest>=7.4"]

[project.scripts]
advoice = "advoice.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
